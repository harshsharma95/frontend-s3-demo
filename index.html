<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Harsh Sharma | Contact</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1f4037, #99f2c8);
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 35px;
            border-radius: 15px;
            width: 360px;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 5px;
        }

        .tech-tag {
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
            color: #ddd;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            top: 12px;
            left: 10px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 10px 10px 10px 35px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        input::placeholder {
            color: #eee;
        }

        input:focus {
            border: 1px solid #00f2fe;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00c6ff;
        }

        #msg {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Harsh Sharma</h2>
    <div class="tech-tag">
        <i class="fa-brands fa-jenkins"></i> DevOps | 
        <i class="fa-solid fa-cloud"></i> Cloud | 
        <i class="fa-brands fa-aws"></i> AWS
    </div>

    <form id="contactForm">

        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="name" placeholder="Enter your name" required>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-phone"></i>
            <input type="text" id="contact" placeholder="Enter your contact" required>
        </div>

        <button type="submit">
            <i class="fa-solid fa-paper-plane"></i> Submit
        </button>

    </form>

    <p id="msg"></p>
</div>

<script>
document.getElementById("contactForm").addEventListener("submit", async function(e) {
    e.preventDefault();

   const data = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value
};
    };

    try {
        const res = await fetch("https://emre4wve9h.execute-api.ap-south-1.amazonaws.com/submit", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await res.json();
        document.getElementById("msg").innerText = result.message;

    } catch (error) {
        document.getElementById("msg").innerText = "⚠️ Backend not connected yet!";
    }
});
</script>

</body>
</html>
