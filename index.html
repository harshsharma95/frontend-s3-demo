<!DOCTYPE html>
<html>
<head>
    <title>Harsh Sharma | Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1f4037, #99f2c8);
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 35px;
            border-radius: 15px;
            width: 360px;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        label {
            font-size: 14px;
            margin-top: 10px;
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            outline: none;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        input::placeholder {
            color: #eee;
        }

        input:focus {
            border: 1px solid #00f2fe;
            background: rgba(255,255,255,0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00c6ff;
        }

        #msg {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

        .tech-tag {
            text-align: center;
            font-size: 12px;
            margin-bottom: 15px;
            color: #ddd;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Harsh Sharma</h2>
    <div class="tech-tag">DevOps | Cloud | AWS</div>

    <form id="contactForm">
        <label>👤 Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>📧 Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>📱 Contact</label>
        <input type="text" id="contact" placeholder="Enter your contact" required>

        <button type="submit">🚀 Submit</button>
    </form>

    <p id="msg"></p>
</div>

<script>
document.getElementById("contactForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        name: document.getElementById("name").value
    };

    try {
        const res = await fetch("YOUR_API_URL", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await res.json();
        document.getElementById("msg").innerText = result.message;

    } catch (error) {
        document.getElementById("msg").innerText = "⚠️ Backend not connected yet!";
    }
});
</script>

</body>
</html>
